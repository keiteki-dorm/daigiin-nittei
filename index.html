<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代議員会日程調整くん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f1; --panel:#ffffff; --panel2:#f8f8f6; --line:#e1e0da; --line2:#c8c6bd;
  --text:#1d1d1b; --text2:#5a5954; --text3:#8c8a83;
  --accent:#5046e5; --accent2:#d946ef; --accent-bg:#eef0ff; --on-accent:#ffffff;
  --kun-body:#ffffff; --kun-line:#2b2f3a; --dot:rgba(80,70,229,.08); --hover:rgba(80,70,229,.05);
  --card-shadow:0 1px 2px rgba(20,20,60,.05),0 4px 14px rgba(20,20,60,.06);
  --err:#c22b2b; --err-bg:#fdeded; --warn:#955600; --warn-bg:#fff2d6; --warn-line:#e0a032;
  --ok:#2b7a37; --ok-bg:#e6f3e7;
  --out:#ebeae5; --lb:#e6f1f9; --nx:#f3f0fa; --sun:#c22b2b; --sat:#2457d6;
  --cl:93%; --cs:70%; --ct:27%; --cb:50%; --dl:42%;
  --el:89%; --es:40%; --et:27%;
  --shadow:0 8px 28px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#181817; --panel:#222220; --panel2:#2a2a27; --line:#393834; --line2:#56544e;
    --text:#ecebe6; --text2:#b2b0a8; --text3:#85837b;
    --accent:#a5a0ff; --accent2:#f0abfc; --accent-bg:#2b2850; --on-accent:#16123a;
    --kun-body:#2c2b38; --kun-line:#ecebf5; --dot:rgba(165,160,255,.08); --hover:rgba(165,160,255,.07);
    --card-shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    --err:#ff8b82; --err-bg:#472323; --warn:#f2c26a; --warn-bg:#43341a; --warn-line:#c48e2b;
    --ok:#8ed19a; --ok-bg:#1f3728;
    --out:#1c1c1b; --lb:#1b2934; --nx:#26232f; --sun:#ff8b82; --sat:#8eb0ff;
    --cl:24%; --cs:42%; --ct:86%; --cb:58%; --dl:44%;
    --el:25%; --es:28%; --et:84%;
    --shadow:0 8px 28px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(var(--dot) 1px,transparent 1.2px) 0 0/18px 18px,var(--bg);color:var(--text);font:14px/1.5 "M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:4px 11px;cursor:pointer;white-space:nowrap;transition:transform .12s,box-shadow .12s,background .12s,border-color .12s}
button:hover{background:var(--panel2)}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 8px rgba(30,30,80,.08)}
button:active:not(:disabled){transform:translateY(0) scale(.97);box-shadow:none}
button:disabled{opacity:.45;cursor:default}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:var(--on-accent);font-weight:700}
button.primary:hover:not(:disabled){box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
button.danger{color:var(--err);border-color:var(--err)}
button.sm{font-size:12px;padding:2px 8px}
input,select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;min-width:0}
input.bad{border-color:var(--err)}
textarea{width:100%;resize:vertical}
.sp{flex:1}
.muted{color:var(--text2);font-size:12px}
.w100{width:100%}

#app{display:flex;flex-direction:column;height:100vh}
#hdr{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:15px}
#termLabel b{font-size:15px}
#totals,#confirmArea,#cloudArea{display:flex;gap:6px;align-items:center}
#cloudArea:empty{display:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:10px;border:0;cursor:pointer;line-height:20px}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok);cursor:default}
.bn{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--accent-bg);border-bottom:1px solid var(--line);flex-wrap:wrap}
#banner:empty{display:none}
#planbar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pl{font-size:12px;color:var(--text2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.ptab{border-radius:6px;padding:3px 12px;font-size:13px}
.ptab.on{background:var(--accent-bg);border-color:var(--accent);color:var(--text);font-weight:600}
.ptab .cf{font-style:normal;font-size:11px;color:var(--ok);margin-left:2px}
.ptab.add{color:var(--text2)}
.cmp{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.pmemo{flex:1;min-width:180px;font-size:13px}

#ovw{padding:4px 14px 2px;background:var(--panel);border-bottom:1px solid var(--line)}
.ov{position:relative;height:112px;cursor:pointer;user-select:none;overflow:hidden}
.ov.cmp{height:136px}
.ov-out{position:absolute;top:0;bottom:0;background:var(--out)}
.ov-nx{position:absolute;top:0;bottom:0;background:var(--nx)}
.ov-nx span{position:absolute;right:3px;top:0;font-size:11px;color:var(--accent);font-weight:700;line-height:14px}
.ov-m{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--text2);padding-left:4px;line-height:14px}
.ov-ev{position:absolute;height:13px;border-radius:3px;font-size:11px;line-height:13px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:hsl(var(--h) var(--es) var(--el));color:hsl(var(--h) 45% var(--et))}
.ov-line{position:absolute;left:0;right:0;top:82px;border-top:1px solid var(--line2)}
.ov-p{position:absolute;top:81px;height:3px;background:hsl(var(--h) 55% var(--cb));opacity:.5}
.ov-h{position:absolute;top:78px;height:9px;border-radius:2px;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) 55% var(--cb))}
.ov-t{position:absolute;top:73px;width:5px;height:19px;margin-left:-2px;border-radius:2px;background:hsl(var(--h) 62% var(--dl))}
.ov-l{position:absolute;top:93px;transform:translateX(-50%);font-size:11px;font-weight:700;color:hsl(var(--h) 60% var(--ct));white-space:nowrap;line-height:15px}
.ov-l.err{color:var(--err);text-decoration:underline wavy}
.ov-l.warn{text-decoration:underline dotted var(--warn-line)}
.ov-s{position:absolute;top:61px;transform:translateX(-50%);font-size:11px;color:var(--text3);white-space:nowrap}
.ov-s.warn{color:var(--warn)}
.ov-s.error{color:var(--err);font-weight:700}
.ov-today{position:absolute;top:14px;bottom:0;border-left:2px solid var(--accent)}
.ov-today span{position:absolute;top:0;left:3px;font-size:11px;color:var(--accent);background:var(--panel);padding:0 2px;line-height:13px}
.ov-ct{position:absolute;top:113px;width:3px;height:12px;margin-left:-1px;background:var(--text3)}
.ov-cl{position:absolute;top:121px;transform:translateX(-50%);font-size:11px;color:var(--text2);white-space:nowrap;line-height:14px}
.ov-cn{position:absolute;top:110px;left:0;font-size:11px;color:var(--text2);background:var(--panel);padding-right:4px}
.ov-cline{position:absolute;left:0;right:0;top:118px;border-top:1px dashed var(--line2)}

main{display:grid;grid-template-columns:minmax(0,1fr) 7px 400px;flex:1;min-height:0}
main.custom{grid-template-columns:min(var(--calW), calc(100% - 327px)) 7px minmax(320px,1fr)}
#calScroll{overflow:auto;position:relative;min-height:0}
#side{overflow:auto;background:var(--panel);min-height:0}
#splitter{cursor:col-resize;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative;touch-action:none;outline:none}
#splitter::after{content:"";position:absolute;top:50%;left:1px;width:3px;height:40px;margin-top:-20px;border-radius:2px;background:var(--line2)}
#splitter:hover,#splitter:focus-visible,#splitter.drag{background:var(--accent-bg);border-color:var(--accent)}
#splitter:hover::after,#splitter.drag::after{background:var(--accent)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none}
@media (max-width:980px){
  #app{height:auto;display:block}
  #splitter{display:none}
  main{display:block}
  #calScroll{height:72vh}
  #side{border-left:0;border-top:1px solid var(--line)}
}

#cal{--rowH:92px;--fs:11px;--clh:16px;--hp:23px;--lh:17px;--chFs:12px;--chLH:18px;min-width:660px;padding:0 10px 30px}
#cal.sz0{--rowH:40px;--fs:11px;--clh:14px;--hp:18px;--lh:14px;--chFs:11px;--chLH:13px;min-width:500px}
#cal.sz1{--rowH:62px;--fs:11px;--clh:15px;--hp:20px;--lh:15px;--chFs:11px;--chLH:15px;min-width:580px}
#cal.sz3{--rowH:122px;--fs:12px;--clh:18px;--hp:26px;--lh:19px;--chFs:13px;--chLH:20px;min-width:760px}
#cal.sz4{--rowH:152px;--fs:13px;--clh:20px;--hp:29px;--lh:21px;--chFs:14px;--chLH:22px;min-width:860px}
#cal.sz0 .chip small{display:none}
.zoom{display:flex;align-items:center;gap:4px}
.zoom button{padding:0 9px;line-height:22px}
.zoom .zv{font-size:12px;min-width:2.5em;text-align:center;color:var(--text2)}
.wh{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));background:var(--bg);font-size:12px;color:var(--text2);text-align:center;padding:5px 0 3px}
.wh .sun{color:var(--sun)} .wh .sat{color:var(--sat)}
.wk{display:grid;grid-template-columns:52px minmax(0,1fr)}
.wl{font-size:12px;color:var(--text2);padding:4px 6px 0 0;text-align:right;line-height:1.3}
.wl b{display:block;font-size:13px;color:var(--text)}
.wl i{display:block;font-style:normal;font-size:11px;color:var(--text3)}
.wl .lbt{color:var(--sat);margin-top:2px}
.days{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{position:relative;min-height:calc(var(--rowH) + var(--nl,0) * var(--lh));padding:calc(var(--hp) + var(--nl,0) * var(--lh)) 3px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);cursor:cell;user-select:none;min-width:0}
.cell:first-child{border-left:1px solid var(--line)}
.cell.out{background:var(--out)}
.cell.lb{background:var(--lb)}
.cell.nterm{background:var(--nx)}
.wl .tml{color:var(--accent);font-weight:700}
.cell.mt{border-top:2px solid var(--line2)}
.cell.ml{border-left:2px solid var(--line2)}
.cell.rsel{background:var(--accent-bg)}
.cell.cur{outline:2px solid var(--accent);outline-offset:-2px;z-index:2}
.ch{position:absolute;top:3px;left:5px;right:4px;display:flex;align-items:center;gap:4px;font-size:var(--chFs);white-space:nowrap;overflow:hidden;line-height:var(--chLH)}
.ch .d{font-weight:700}
.cell.out .ch .d{color:var(--text3)}
.cell.sun .ch .d,.cell.hol .ch .d{color:var(--sun)}
.cell.sat .ch .d{color:var(--sat)}
.cell.today .ch .d{background:var(--accent);color:var(--on-accent);border-radius:9px;padding:0 6px}
.ch .hn{font-size:11px;color:var(--sun);overflow:hidden;text-overflow:ellipsis}
.cand{margin-left:auto;flex:none;font-weight:700;font-size:var(--chFs,13px);width:calc(var(--chLH,18px) + 2px);height:calc(var(--chLH,18px) + 2px);border-radius:50%;display:inline-grid;place-items:center;line-height:1}
.cand.ok{color:var(--ok);background:var(--ok-bg)}
.cand.tri{color:var(--warn);background:var(--warn-bg)}
.cand.x{color:var(--err);background:var(--err-bg)}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;align-items:center;gap:3px;font-size:var(--fs);line-height:var(--clh);padding:0 4px;border-radius:4px;white-space:nowrap;overflow:hidden;cursor:grab;touch-action:none;background:hsl(var(--h) var(--cs) var(--cl));color:hsl(var(--h) 65% var(--ct));border:1px solid hsl(var(--h) 55% var(--cb) / .55)}
.chip small{font-size:var(--fs);opacity:.8;margin-left:auto;flex:none}
.chip.r-D{background:hsl(var(--h) 62% var(--dl));color:#fff;border-color:transparent;font-weight:700;line-height:calc(var(--clh) + 4px)}
.chip.sel{box-shadow:0 0 0 2px hsl(var(--h) 75% 48%)}
.chip.moving{opacity:.75}
.chip.warn{border:1px dashed var(--warn-line)}
.chip.warn::before{content:"!";flex:none;display:inline-grid;place-items:center;width:12px;height:12px;border-radius:50%;background:var(--warn-line);color:#fff;font-size:10px;font-weight:700;line-height:1}
.chip.ghost{background:transparent;border:1px dashed var(--line2);color:var(--text2);cursor:default}
.mk{font-size:var(--fs);color:var(--err);border:1px solid var(--err);border-radius:4px;padding:0 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:var(--clh)}
.bar{position:absolute;height:calc(var(--lh) - 2px);font-size:var(--fs);line-height:calc(var(--lh) - 2px);padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:hsl(var(--h) var(--es) var(--el));color:hsl(var(--h) 45% var(--et));cursor:pointer;z-index:1}
.bar.s{border-top-left-radius:4px;border-bottom-left-radius:4px}
.bar.e{border-top-right-radius:4px;border-bottom-right-radius:4px}
body.dragging .bar{pointer-events:none}
body.chipdrag,body.chipdrag *{cursor:grabbing!important}
.legend-cal{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);padding:10px 0 0 52px}
.legend-cal span{display:inline-flex;align-items:center;gap:5px}
.legend-cal i{display:inline-block;width:14px;height:12px;border-radius:3px;border:1px solid var(--line2)}

.stabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:3}
.stabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--text2)}
.stabs button.on{border-bottom-color:var(--accent);color:var(--text);font-weight:700}
.stabs .cnt{font-size:11px;color:var(--text3);margin-left:2px}
.sbody{padding:12px 14px 40px}
.sum{margin-bottom:12px}
.sum-h{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.next{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel2)}
.next-h{font-size:12px;color:var(--text2);margin-bottom:2px}
.nx{display:flex;gap:8px;font-size:13px;padding:2px 0;cursor:pointer;align-items:baseline}
.nx:hover .nx-t{text-decoration:underline}
.nx-d{flex:none;width:72px;font-variant-numeric:tabular-nums}
.nx-t{flex:1;min-width:0}
.nx-r{flex:none;font-size:12px;color:var(--text2)}
.nx-r.soon{color:var(--err);font-weight:700}
.glob{margin-top:8px}
.empty{font-size:13px;color:var(--text2);padding:16px;border:1px dashed var(--line2);border-radius:10px;text-align:center}
.mc{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 10px;cursor:pointer}
.mc.error{border-color:var(--err)}
.mc.warn{border-color:var(--warn-line)}
.mc.sel{box-shadow:0 0 0 3px hsl(var(--h) 65% 50% / .35);border-color:hsl(var(--h) 60% 50%)}
.mc.dropin{outline:2px dashed var(--accent);outline-offset:2px}
.mc-h{display:flex;align-items:center;gap:8px}
.mc-h .dot{flex:none;width:12px;height:12px;border-radius:3px;background:hsl(var(--h) 62% var(--dl))}
.mc-h b{font-size:15px}
.mc-h .dt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.tag{font-size:11px;color:var(--text2);border:1px solid var(--line2);border-radius:4px;padding:0 5px;line-height:16px}
.tag.nxt{color:var(--accent);border-color:var(--accent)}
.tag.lock{color:var(--ok);border-color:var(--ok)}
.row-in{display:flex;gap:6px;align-items:center;min-width:0}
.row-in input{flex:1}
.chip.r-D.locked{cursor:pointer;outline:2px solid hsl(var(--h) 62% var(--dl));outline-offset:1px}
.chip.r-D.locked small{opacity:1;font-weight:700}
.mc-sub{font-size:12px;color:var(--text2);margin-top:2px}
.memo{font-size:12px;color:var(--text2);margin-top:4px;white-space:pre-wrap;border-left:3px solid var(--line2);padding-left:6px}
.iss{font-size:12px;margin-top:4px;display:flex;gap:6px;line-height:1.45}
.iss .ic{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px;line-height:1}
.iss.error{color:var(--err)} .iss.error .ic{background:var(--err);color:var(--panel)}
.iss.warn{color:var(--warn)} .iss.warn .ic{background:var(--warn-line);color:#fff}
.iss.info{color:var(--text2)} .iss.info .ic{background:var(--line2);color:var(--panel)}
.iss.okk{color:var(--ok)}
.iss .bs{display:block;font-size:11px;color:var(--text3)}
.ags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ag{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);cursor:grab;line-height:18px}
.ag .w{font-size:11px;margin-left:4px;color:var(--text3)}
.ag.w3{border-color:var(--warn-line)}
.ag.w3 .w{color:var(--warn);font-weight:700}
.ag .rk{font-style:normal;font-size:11px;color:var(--accent);margin-right:3px}
.ag-add{font-size:12px;padding:0 7px;line-height:18px;border-style:dashed;color:var(--text2)}
.gap{font-size:12px;color:var(--text3);padding:4px 0 4px 16px}
.gap.warn{color:var(--warn)} .gap.error{color:var(--err);font-weight:700}
.mc-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:8px;cursor:default}
.fg{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:8px;font-size:13px}
.fg>label{color:var(--text2)}
.fg.col{grid-template-columns:1fr}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:2px}
.mini .mh{font-size:11px;color:var(--text3);text-align:center}
.md-d{padding:2px 0;font-size:12px;border-radius:4px;border:1px solid var(--line);background:var(--panel);text-align:center;line-height:1.2;min-height:34px}
.md-d i{display:block;font-style:normal;font-size:11px;color:var(--text2)}
.md-d.on{background:hsl(var(--h) var(--cs) var(--cl));border-color:hsl(var(--h) 55% var(--cb));color:hsl(var(--h) 65% var(--ct));font-weight:700}
.md-d.r-D{background:hsl(var(--h) 62% var(--dl));color:#fff;opacity:1}
.md-d.r-D i{color:#fff}
.row-end{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.evrow{border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px;display:grid;gap:4px}
.evr1,.evr2{display:flex;gap:6px;align-items:center}
.evr1 input{flex:1}
.evr2{font-size:12px}
.evr2 select{max-width:150px}
.evdot{flex:none;width:12px;height:12px;border-radius:3px;background:hsl(var(--h) var(--es) var(--el));border:1px solid hsl(var(--h) 40% 55%)}
.icon{padding:0 8px;line-height:24px}
.legend{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px}
.lg-h{font-size:12px;color:var(--text2)}
.lg{display:grid;grid-template-columns:14px 140px 1fr;gap:6px;align-items:center;font-size:12px}
.lg span:last-child{color:var(--text2)}

/* ===== 見た目の仕上げと演出 ===== */

}

<script>
'use strict';
/* ===== 日付 ===== */
const DAY = 864e5, WD = ['月','火','水','木','金','土','日'];
const pad = n => String(n).padStart(2, '0');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const dnOf = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / DAY);
const toDn = s => { const [y, m, d] = s.split('-').map(Number); return dnOf(y, m, d); };
const dnYmd = n => { const t = new Date(n * DAY); return {y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate()}; };
const toStr = n => { const {y, m, d} = dnYmd(n); return `${y}-${pad(m)}-${pad(d)}`; };
const dow = n => ((n + 3) % 7 + 7) % 7; // 0=月 … 6=日
const lastDayOfMonth = (y, m) => dnOf(y, m + 1, 1) - 1;
const nthWeekday = (y, m, wd, k) => { const f = dnOf(y, m, 1); return f + ((wd - dow(f) + 7) % 7) + (k - 1) * 7; };
const fmt = (n, w = true) => { const {m, d} = dnYmd(n); return w ? `${m}/${d}(${WD[dow(n)]})` : `${m}/${d}`; };
const fmtY = n => { const {y, m, d} = dnYmd(n); return `${y}/${m}/${d}`; };
function todayDn() { const t = new Date(); return dnOf(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
function range(a, b) { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; }
function runs(list) {
  const s = [...new Set(list)].sort((a, b) => a - b), out = [];
  s.forEach(d => { const l = out[out.length - 1]; if (l && d === l[1] + 1) l[1] = d; else out.push([d, d]); });
  return out;
}
const fmtRuns = list => runs(list).map(([a, b]) => a === b ? fmt(a) : `${fmt(a)}〜${fmt(b)}`).join('、');
const gapText = g => g < 7 ? `${g}日` : g % 7 === 0 ? `${g / 7}週間` : `${Math.floor(g / 7)}週間と${g % 7}日`;
function monthBefore(n) { const {y, m, d} = dnYmd(n); const last = dnYmd(lastDayOfMonth(y, m - 1)).d; return dnOf(y, m - 1, Math.min(d, last)); }

/* ===== 祝日 ===== */
const holCache = {};
function holidaysOfYear(y) {
  if (holCache[y]) return holCache[y];
  const H = new Map(), b = y - 1980, q = Math.floor(b / 4);
  const set = (n, name) => H.set(n, name);
  set(dnOf(y, 1, 1), '元日'); set(nthWeekday(y, 1, 0, 2), '成人の日');
  set(dnOf(y, 2, 11), '建国記念の日'); set(dnOf(y, 2, 23), '天皇誕生日');
  set(dnOf(y, 3, Math.floor(20.8431 + 0.242194 * b - q)), '春分の日');
  set(dnOf(y, 4, 29), '昭和の日'); set(dnOf(y, 5, 3), '憲法記念日'); set(dnOf(y, 5, 4), 'みどりの日'); set(dnOf(y, 5, 5), 'こどもの日');
  set(nthWeekday(y, 7, 0, 3), '海の日'); set(dnOf(y, 8, 11), '山の日'); set(nthWeekday(y, 9, 0, 3), '敬老の日');
  set(dnOf(y, 9, Math.floor(23.2488 + 0.242194 * b - q)), '秋分の日');
  set(nthWeekday(y, 10, 0, 2), 'スポーツの日'); set(dnOf(y, 11, 3), '文化の日'); set(dnOf(y, 11, 23), '勤労感謝の日');
  for (const k of [...H.keys()].sort((a, c) => a - c)) if (H.has(k + 2) && !H.has(k + 1) && dow(k + 1) !== 6) H.set(k + 1, '国民の休日');
  for (const k of [...H.keys()].sort((a, c) => a - c)) if (dow(k) === 6) { let n = k + 1; while (H.has(n)) n++; H.set(n, '振替休日'); }
  return holCache[y] = H;
}
const holidayName = n => holidaysOfYear(dnYmd(n).y).get(n);

/* ===== 定数 ===== */
const HUES = [212, 18, 165, 275, 125, 335, 190, 45];
const SYM = {ok: '○', tri: '△', x: '×'};
const LONG_BREAK_MONTHS = [2, 3, 8, 9];
const WEIGHT_NAME = {1: '軽', 2: '中', 3: '重'};
const ROLE_ORDER = {D: 0, draft: 1, dist: 2, heyairi: 3, report: 4, rmeet: 5};
const ROLE_NAME = {D: '代議員会', draft: '議長団第一稿', dist: '議案配布', heyairi: '部屋入り', report: '部屋入り報告', rmeet: '部屋入り報告集会'};
const ROLE_ABBR = {D: '代', draft: '稿', dist: '配', report: '報', rmeet: '集'};
const STAGE_NAMES = {prep: '第一稿〜議案配布', heyairi: '部屋入り', meeting: '報告〜代議員会'};
const AG_RULES = {'': 'なし', soron: '総論', shikko: '〇執基本方針', budget: '暫定予算', nyusen: '入銓基本方針', kessan: '決算', kansa: '監査の承認'};
const PRESETS = {
  normal:  {name: '通常（部屋入り 木〜日）', short: '通常', heyairi: [-10, -9, -8, -7]},
  weekday: {name: '平日（部屋入り 火〜金）', short: '平日', heyairi: [-12, -11, -10, -9]},
  long:    {name: 'すり合わせ長め（部屋入りを1週早める）', short: '長め', heyairi: [-17, -16, -15, -14]},
};
const CATS = {
  test:      {name: 'テスト期間', hue: 0, stages: ['prep', 'heyairi', 'meeting'], basis: '1定・7定のコメント（テストと被ると委員長などの負担）'},
  seijin:    {name: '成人式', hue: 285, stages: ['prep', 'heyairi', 'meeting'], basis: '1月定例のコメント（成人式と被って1・2年目がいない）'},
  nenmatsu:  {name: '年末年始', hue: 305, stages: ['prep', 'heyairi', 'meeting'], basis: '1月定例のコメント（お正月に議長団会議をした）'},
  shinkan:   {name: '新歓・新歓士幌', hue: 130, stages: ['heyairi'], basis: '新歓、寮祭'},
  ryosai:    {name: '寮祭・観楓会', hue: 28, stages: ['heyairi'], basis: '新歓、寮祭'},
  oikon:     {name: '追いコン', hue: 330, stages: ['heyairi', 'meeting'], basis: '代議員会間のスパン（追いコン期）'},
  heyagae:   {name: '部屋替え', hue: 48, stages: ['heyairi', 'meeting'], basis: '議案の理想的な時期（12月定例のコメント）'},
  election:  {name: '選挙（公示の日から）', hue: 220, stages: [], basis: '年目コンパおよび選挙'},
  compa:     {name: '年目コンパ', hue: 180, stages: [], basis: '年目コンパおよび選挙（被ってもよい）'},
  longbreak: {name: '長期休暇', hue: 205, stages: [], basis: '長期休暇'},
  other:     {name: 'その他（重なると注意）', hue: 60, stages: ['heyairi', 'meeting'], basis: '予定との重なり'},
  memo:      {name: 'メモ（表示のみ）', hue: 40, sat: 6, stages: [], basis: ''},
};
const catTitle = k => (CATS[k] || CATS.memo).name.replace(/（.*）$/, '');
const RULES = [
  {key: 'span-min', level: 'error', name: '前の代議員会から2週間未満', basis: '代議員会間のスパン'},
  {key: 'first-month', level: 'error', name: '期の最初の月（6月・12月）に代議員会か総論がない', basis: '規約〈〇執〉'},
  {key: 'next-first', level: 'error', name: '次の期の最初の月（6月・12月）の定例が決まっていない', basis: '議案の理想的な時期（6月・12月定例）、規約〈〇執〉'},
  {key: 'shikko', level: 'error', name: '〇執基本方針が、総論の次の代議員会より後にある', basis: '規約〈〇執〉'},
  {key: 'budget', level: 'error', name: '暫定予算が〇執基本方針と別の回にある', basis: '規約〈予算・決算〉'},
  {key: 'nyusen', level: 'error', name: '入銓基本方針が、総論承認後最初の定例より後にある', basis: '規約〈入銓〉'},
  {key: 'kessan', level: 'error', name: '決算が任期終了後最初の月にない', basis: '規約〈予算・決算〉'},
  {key: 'kansa', level: 'error', name: '監査の承認が選挙より後にある', basis: '年目コンパおよび選挙'},
  {key: 'longbreak', level: 'error', name: '長期休暇中の回の情宣期限（6月末・12月末）を過ぎている', basis: '長期休暇'},
  {key: 'henko', level: 'error', name: '確定後の変更で、1か月前の周知期限を過ぎている', basis: '代議員会日程の情宣'},
  {key: 'order', level: 'error', name: '日程の順番が崩れている', basis: '基本的な代議員会に関わる日程'},
  {key: 'fiscal', level: 'error', name: '部屋入りから代議員会までが年度（4月1日）をまたぐ', basis: '部屋入りから代議員会までは同じ年度に収める（328期議長の決まり）'},
  {key: 'span-rec', level: 'warn', name: '定例どうしの間隔が3週間未満', note: '臨時が絡む間隔は、基本方針・総括の時期として除く', basis: '代議員会間のスパン'},
  {key: 'sunday', level: 'warn', name: '代議員会が日曜でない', basis: '基本的な代議員会に関わる日程'},

function nfRange(endStr) { const te = toDn(endStr), {y, m} = dnYmd(te + 1); return [te + 1, lastDayOfMonth(y, m)]; }

function templateMeetings(num) {

  const nth = (k, n) => { const i = y * 12 + (m - 1) + k; return nthWeekday(Math.floor(i / 12), i % 12 + 1, 6, n); };
  const A = templateAgenda(num);

  // 最後の月の定例は、選挙の公示に間に合うよう1週目（tight：前の定例から2週間でもよい）
  const spec = [
    {kind: '定例', t: nth(0, 4), ag: A.first_teirei},

    const c = C.get(m.id), l = L(m), v = ymOf(m);
    if (c.D < ts || c.D > nfe) add('range', [m.id], `${l}（${fmt(c.D)}）が期の範囲（${fmt(ts)}〜${fmt(te)}と、次の期の${nfm}月）の外にある`);
    if (dow(c.D) !== 6) add('sunday', [m.id], `${l}が${WD[dow(c.D)]}曜日になっている`, {dns: [c.D]});
    if (!c.heyairi.length) add('no-heyairi', [m.id], `${l}に部屋入りの日がない`);
    else {
      const hs = c.heyairi[0], he = c.heyairi[c.heyairi.length - 1];
      if (!(c.draft < c.dist && c.dist < hs && he < c.report && c.report <= c.rmeet && c.rmeet <= c.D))
        add('order', [m.id], `${l}の日程の順番が崩れている（第一稿→議案配布→部屋入り→報告→報告集会→代議員会の順にする）`);
      if (crossesFiscal(c.D, hs - c.D)) {
        const a1 = dnOf(dnYmd(c.D).y, 4, 1);
        add('fiscal', [m.id], `${l}の部屋入り（${fmt(hs)}〜）から代議員会までが年度をまたぐ（部屋入りは${fmt(a1)}から）`, {dns: range(hs, a1 - 1)});
      }
    }
    if (i > 0) {
      const p = ms[i - 1], g = c.D - C.get(p.id).D;
      if (g < S.minSpan) add('span-min', [p.id, m.id], `${L(p)}から${l}まで${gapText(g)}しかない（最低${gapText(S.minSpan)}）`, {at: m.id, sig: p.id});
      else if (g < S.recSpan && p.kind === '定例' && m.kind === '定例') add('span-rec', [p.id, m.id], `${L(p)}から${l}まで${gapText(g)}（${gapText(S.recSpan)}以上あると楽）`, {at: m.id, sig: p.id});
    }
    if ((inFirst(m) || inNextFirst(m)) && m.kind === '定例' && (v.d < 15 || v.d > 28)) add('first-week', [m.id], `${l}が${Math.ceil(v.d / 7)}週目にある（3・4週目がよい）`);
    const sd = {prep: range(c.draft, c.dist), heyairi: c.heyairi, meeting: range(c.report, c.D)};
    T.events.forEach(ev => {
      const cat = CATS[ev.cat]; if (!cat || !cat.stages.length) return;
      const es = toDn(ev.start), ee = toDn(ev.end);
      cat.stages.forEach(st => {
        const days = sd[st].filter(d => d >= es && d <= ee);
        if (days.length) add('overlap', [m.id], `${l}の${STAGE_NAMES[st]}（${fmtRuns(days)}）が「${ev.title}」と重なる`, {dns: days, basis: cat.basis, sig: ev.id + st});
      });
    });
    const ag = m.agenda || [], score = ag.reduce((s, a) => s + (+a.weight || 1), 0);
    if (score >= S.heavyScore) add('many', [m.id], `${l}の議案が多い（${ag.length}件・${score}点）。第一稿を早めるか、別の回に分ける`);
    if (LONG_BREAK_MONTHS.includes(v.m)) {
      const hv = ag.filter(a => +a.weight === 3);
      if (hv.length) add('heavy-break', [m.id], `${l}は長期休暇中。重い議案（${hv.map(a => a.title).join('、')}）がある`);
    }
  });

  const mar = ms.filter(m => ymOf(m).m === 3);
  if (mar.length >= 2) add('march', mar.map(m => m.id), `3月に${mar.length}回ある（追いコン期。荒れない議案にするか、1回を2月に回す）`, {at: mar[mar.length - 1].id});
  [4, 10].forEach(mo => {
    const xs = ms.filter(m => ymOf(m).m === mo); if (!xs.length || ymOf(xs[0]).d <= 15) return;
    const c0 = C.get(xs[0].id), hsOff = c0.heyairi.length ? c0.heyairi[0] - c0.D : -10;
    if (mo === 4 && crossesFiscal(c0.D - 7, hsOff)) return; // 1週早めると年度をまたぐので、これが最も早い
    add('early', [xs[0].id], `${L(xs[0])}が${ymOf(xs[0]).d}日。${mo === 4 ? '新歓' : '寮祭'}の時期なので、月の頭のほうがよい`);
  });

  // 今期の回（cur）だけで判定する。次の期の最初の回は、次の期の総論・決算を出す回として別に扱う
  const idx = key => cur.findIndex(m => (m.agenda || []).some(a => a.rule === key));
  const so = idx('soron'), si = idx('shikko'), bi = idx('budget'), ni = idx('nyusen'), ai = idx('kansa');
  if (!ms.some(inFirst)) add('first-month', [], `${f.m}月に代議員会がない（${f.m}月に総論を出す必要がある）`);
  else if (so >= 0 && !inFirst(cur[so])) add('first-month', [cur[so].id], `総論が${L(cur[so])}にある（${f.m}月に出す必要がある）`);
  if (!ms.some(m => inNextFirst(m) && m.kind === '定例')) add('next-first', [], `${nfm}月定例（${T.term.number + 1}期の最初の回）が決まっていない。総論・決算を出す回なので、今期のうちに決めておく`);
  if (so >= 0 && si >= 0) {
    if (si < so) add('shikko', [cur[si].id], `〇執基本方針（${L(cur[si])}）が総論より前にある`);
    else if (si > so + 1) add('shikko', [cur[si].id], `〇執基本方針が${L(cur[si])}にある。総論の次の回（${L(cur[so + 1])}）までに出す`);
  }
  if (bi >= 0 && si >= 0 && bi !== si) add('budget', [cur[bi].id, cur[si].id], `暫定予算（${L(cur[bi])}）と〇執基本方針（${L(cur[si])}）が別の回にある`);
  if (so >= 0 && ni >= 0) {
    const ft = cur.findIndex((m, i) => i > so && m.kind === '定例');
    if (ft >= 0 && ni > ft) add('nyusen', [cur[ni].id], `入銓基本方針が${L(cur[ni])}にある。総論のあと最初の定例（${L(cur[ft])}）までに出す`);
  }
  ms.forEach(m => {
    if ((m.agenda || []).some(a => a.rule === 'kessan') && !inFirst(m) && !inNextFirst(m))
      add('kessan', [m.id], `決算が${L(m)}にある（任期が終わった次の月、${f.m}月か${nfm}月に出す）`, {sig: m.id});
  });
  const el = T.events.filter(e => e.cat === 'election').sort((a, b) => a.start < b.start ? -1 : 1)[0];
  if (ai >= 0) {
    if (el) { const es = toDn(el.start), D = C.get(cur[ai].id).D; if (D >= es) add('kansa', [cur[ai].id], `監査の承認（${L(cur[ai])} ${fmt(D)}）が選挙の公示（${fmt(es)}）より後にある`); }
    else if (!off.has('kansa')) infos.push({msg: '「予定」に選挙を入れると、監査の承認が選挙に間に合うか確かめられます'});
  }

  const lb = ms.filter(m => LONG_BREAK_MONTHS.includes(ymOf(m).m) && C.get(m.id).D >= ts && C.get(m.id).D <= te);
  if (lb.length && !off.has('longbreak')) {
    const dl = lastDayOfMonth(f.y, f.m);
    markers.push({dn: dl, text: `情宣期限（${lb.map(mShort).join('・')}）`});
    lb.forEach(m => {
      const cf = conf && conf.meetings.find(x => x.id === m.id);
      const ok = cf && cf.date === m.date && toDn(conf.at) <= dl;
      if (TODAY > dl && !ok) add('longbreak', [m.id], `${L(m)}は長期休暇中の回。情宣期限（${fmt(dl)}）を過ぎてから決まっている`);
      else if (!ok) infos.push({mid: m.id, msg: `長期休暇中の回。${fmt(dl)}までにビラか棟吊看板で情宣する`});
      else infos.push({mid: m.id, msg: `長期休暇中の回（期限の${fmt(dl)}までに確定済み）`});
    });
  }
  if (conf && !off.has('henko')) {
    ms.forEach(m => {
      const cf = conf.meetings.find(x => x.id === m.id), D = C.get(m.id).D;
      if (!cf) {
        const dl = monthBefore(D); markers.push({dn: dl, text: `周知期限（${mShort(m)}の追加）`});
        if (TODAY > dl) add('henko', [m.id], `${L(m)}は確定後に追加された。周知期限（${fmt(dl)}）を過ぎている`);
        else infos.push({mid: m.id, msg: `確定後に追加した回。${fmt(dl)}までに全寮へ周知する`});
      } else if (cf.date !== m.date) {
        const old = toDn(cf.date), dl = monthBefore(Math.min(old, D));
        markers.push({dn: dl, text: `周知期限（${mShort(m)}の変更）`});
        if (TODAY > dl) add('henko', [m.id], `${L(m)}を${fmt(old)}から${fmt(D)}に動かしたが、周知期限（${fmt(dl)}）を過ぎている`);
        else infos.push({mid: m.id, msg: `確定した日（${fmt(old)}）から動かした。${fmt(dl)}までに全寮へ周知する`});
      }
    });
    conf.meetings.filter(x => !plan.meetings.some(m => m.id === x.id))
      .forEach(x => infos.push({msg: `確定していた${x.label}（${fmt(toDn(x.date))}）がなくなっている。取りやめを全寮へ周知する`}));
  }
  return {issues, infos, markers, chains: C, sorted: ms};
}

/* ===== 描画 ===== */
function render() {
  const p = activePlan();
  if (ui.sel && !p.meetings.some(m => m.id === ui.sel)) ui.sel = null;
  if (ui.compare && (ui.compare === p.id || !planById(ui.compare))) ui.compare = '';
  R = checkPlan(effectivePlan(p));
  RC = ui.compare ? checkPlan(planById(ui.compare)) : null;
  renderHeader(); renderBanner(); renderPlanbar();
  const ov = $('#ov'); ov.innerHTML = overviewHTML(R, RC, ui.compare ? planById(ui.compare).name : ''); ov.classList.toggle('cmp', !!RC);
  renderCalendar(); renderSide();
}
function renderHeader() {
  const ne = R.issues.filter(x => x.level === 'error').length, nw = R.issues.filter(x => x.level === 'warn').length;
  $('#termLabel').innerHTML = `<b>${T.term.number}期</b> <span class="muted">${fmtY(toDn(T.term.start))}〜${fmtY(toDn(T.term.end))}</span>`;
  $('#totals').innerHTML = (ne ? `<button class="pill err" data-act="first-issue" data-lv="error">エラー ${ne}</button>` : '') +
    (nw ? `<button class="pill warn" data-act="first-issue" data-lv="warn">注意 ${nw}</button>` : '') +
    (!ne && !nw ? '<span class="pill ok">問題なし</span>' : '');
  const cp = T.confirmed && planById(T.confirmed.planId);
  $('#confirmArea').innerHTML = T.confirmed
    ? `<span class="pill ok">確定済み：${esc(cp ? cp.name : '消した案')}（${fmt(toDn(T.confirmed.at), false)}）</span>${ui.viewOnly ? '' : '<button class="sm" data-act="unconfirm">確定を取り消す</button>'}`
    : (ui.viewOnly ? '' : '<button data-act="confirm">この案で確定</button>');
  $('#btnUndo').disabled = ui.viewOnly || !undoStack.length;
  $('#cloudArea').innerHTML = cloudHTML();
  renderKun();
}
function renderBanner() {
  $('#banner').innerHTML = ui.viewOnly ? `<div class="bn"><span>共有された日程を見ています（見るだけ）。</span><span class="sp"></span><button data-act="save-shared">手元に保存して編集する</button><button data-act="open-own">自分のデータを開く</button></div>`
    : !storageOK && !cloud.user ? '<div class="bn"><span>このブラウザでは自動保存ができません。閉じる前に「共有・印刷」の「書き出す」でファイルに保存してください。</span></div>' : '';
}
function renderPlanbar() {
  const p = activePlan();
  let h = `<span class="pl">案</span><div class="tabs">${T.plans.map(x => `<button class="ptab ${x.id === p.id ? 'on' : ''}" data-act="plan" data-pid="${x.id}" title="ダブルクリックで名前を変える">${esc(x.name)}${T.confirmed && T.confirmed.planId === x.id ? ' <i class="cf">確定</i>' : ''}</button>`).join('')}`;
  if (!ui.viewOnly) h += `<button class="ptab add" data-act="plan-menu">＋ 案を増やす・編集</button>`;
  h += `</div><span class="zoom" title="カレンダーの表示サイズ"><span class="pl">表示</span><button data-act="zoom" data-d="-1" aria-label="小さく" ${calSize() === 0 ? 'disabled' : ''}>−</button><span class="zv">${CAL_SIZES[calSize()]}</span><button data-act="zoom" data-d="1" aria-label="大きく" ${calSize() === CAL_SIZES.length - 1 ? 'disabled' : ''}>＋</button></span>`;
  h += `<label class="cmp">比べる案 <select data-act-change="compare"><option value="">なし</option>${T.plans.filter(x => x.id !== p.id).map(x => `<option value="${x.id}" ${ui.compare === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`;
  h += `<input class="pmemo" data-act-change="plan-memo" placeholder="この案のねらい（メモ）" value="${esc(p.memo || '')}" ${ui.viewOnly ? 'disabled' : ''}>`;
  $('#planbar').innerHTML = h;
}

function overviewHTML(r, rc, cmpName) {
  const [a, b] = calRange(), tot = b - a + 1, S = T.settings;
  const X = d => ((d - a) / tot * 100).toFixed(3) + '%', W = n => (n / tot * 100).toFixed(3) + '%';
  const ts = toDn(T.term.start), te = toDn(T.term.end), [nfs, nfe] = nfRange(T.term.end);
  let h = `<div class="ov-out" style="left:0;width:${W(ts - a)}"></div><div class="ov-nx" style="left:${X(nfs)};width:${W(nfe - nfs + 1)}"><span>${T.term.number + 1}期</span></div><div class="ov-out" style="left:${X(nfe + 1)};right:0"></div>`;
  let {y, m} = dnYmd(a);
  for (;;) { const d = dnOf(y, m, 1); if (d > b) break; if (d >= a) h += `<div class="ov-m" style="left:${X(d)}">${m}月</div>`; m++; if (m > 12) { m = 1; y++; } }
  const evs = T.events.map(e => ({e, s: Math.max(a, toDn(e.start)), t: Math.min(b, toDn(e.end))})).filter(x => x.s <= x.t).sort((p, q) => p.s - q.s || q.t - p.t);
  const ends = [];
  evs.forEach(x => { let l = ends.findIndex(v => v < x.s); if (l < 0) { l = ends.length; ends.push(x.t); } else ends[l] = x.t; x.l = l; });
  evs.filter(x => x.l < 3).forEach(x => {
    const c = CATS[x.e.cat] || CATS.memo;
    h += `<div class="ov-ev" style="left:${X(x.s)};width:${W(x.t - x.s + 1)};top:${16 + x.l * 14}px;--h:${c.hue};${c.sat != null ? `--es:${c.sat}%;` : ''}" title="${esc(x.e.title)} ${fmt(toDn(x.e.start))}〜${fmt(toDn(x.e.end))}">${esc(x.e.title)}</div>`;
  });
  h += '<div class="ov-line"></div>';
  const ms = r.sorted;
  ms.forEach((mm, i) => {
    const c = r.chains.get(mm.id), hue = HUES[i % HUES.length];
    const iss = r.issues.filter(x => x.at === mm.id), bad = iss.some(x => x.level === 'error'), warn = iss.length > 0;
    h += `<div class="ov-p" style="left:${X(c.draft)};width:${W(Math.max(0, c.dist - c.draft))};--h:${hue}"></div>`;
    runs(c.heyairi).forEach(([s, e]) => { h += `<div class="ov-h" style="left:${X(s)};width:${W(e - s + 1)};--h:${hue}"></div>`; });
    h += `<div class="ov-t" data-mid="${mm.id}" style="left:${X(c.D + 0.5)};--h:${hue}" title="${esc(mLabel(mm))} ${fmt(c.D)}"></div>`;
    h += `<div class="ov-l ${bad ? 'err' : warn ? 'warn' : ''}" data-mid="${mm.id}" style="left:${X(c.D + 0.5)};--h:${hue}" title="${esc(mLabel(mm))} ${fmt(c.D)}">${esc(mShort(mm))}</div>`;
    if (i > 0) {
      const pm = ms[i - 1], pd = r.chains.get(pm.id).D, g = c.D - pd;
      const lvl = g < S.minSpan ? 'error' : (g < S.recSpan && mm.kind === '定例' && pm.kind === '定例') ? 'warn' : '';
      h += `<div class="ov-s ${lvl}" style="left:${X((pd + c.D) / 2 + 0.5)}">${g % 7 ? g + '日' : g / 7 + '週'}</div>`;
    }
  });
  if (rc) {
    h += `<div class="ov-cline"></div><div class="ov-cn">${esc(cmpName)}</div>`;
    rc.sorted.forEach(mm => { const D = rc.chains.get(mm.id).D; h += `<div class="ov-ct" style="left:${X(D + 0.5)}"></div><div class="ov-cl" style="left:${X(D + 0.5)}">${esc(mShort(mm))}</div>`; });
  }
  if (TODAY >= a && TODAY <= b) h += `<div class="ov-today" style="left:${X(TODAY + 0.5)}"><span>今日</span></div>`;
  return h;
}

function renderCalendar() {
  const [a, b] = calRange(), ts = toDn(T.term.start), te = toDn(T.term.end), [nfs, nfe] = nfRange(T.term.end);
  const byDay = new Map(), put = (d, o) => { if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(o); };
  const warnSet = new Set();
  R.issues.forEach(x => x.dns.forEach(d => x.mids.forEach(id => warnSet.add(id + ':' + d))));
  const movingId = ui.drag && ui.drag.moved ? ui.drag.mid : null;
  R.sorted.forEach((m, i) => {
    const c = R.chains.get(m.id), hue = HUES[i % HUES.length], l = mLabel(m), sh = mShort(m), sel = ui.sel === m.id;
    const chip = (d, role, label, title) => put(d, {o: i * 10 + ROLE_ORDER[role], h:
      `<span class="chip r-${role}${sel ? ' sel' : ''}${warnSet.has(m.id + ':' + d) ? ' warn' : ''}${movingId === m.id ? ' moving' : ''}${role === 'D' && m.locked ? ' locked' : ''}" style="--h:${hue}" data-mid="${m.id}" data-role="${role}" title="${esc(role === 'D' && m.locked ? `${l} ${fmt(c.D)}（日付確定。動かすには右の一覧で確定を外す）` : title)}">${label}${role === 'D' ? (m.locked ? '<small>確</small>' : '') : `<small>${esc(sh)}</small>`}</span>`});
    chip(c.D, 'D', esc(l), `${l} ${fmt(c.D)}（代表者会議も同じ日）\nドラッグで日程ごと動かせます`);
    chip(c.draft, 'draft', '第一稿', `${l}の議長団第一稿 ${fmt(c.draft)}`);
    chip(c.dist, 'dist', '議案配布', `${l}の議案配布 ${fmt(c.dist)}`);
    c.heyairi.forEach(d => chip(d, 'heyairi', '部屋入り', `${l}の部屋入り ${fmtRuns(c.heyairi)}\nドラッグで部屋入りをまとめて動かせます`));
    chip(c.report, 'report', '報告', `${l}の部屋入り報告 ${fmt(c.report)}`);
    chip(c.rmeet, 'rmeet', '報告集会', `${l}の部屋入り報告集会 ${fmt(c.rmeet)}（集会報告は金か土に配布）`);
  });
  if (RC) {
    const nm = planById(ui.compare).name;
    RC.sorted.forEach(m => {
      const c = RC.chains.get(m.id);
      put(c.D, {o: 900, h: `<span class="chip ghost" title="${esc(nm)}の${esc(mLabel(m))}">${esc(nm)} ${esc(mShort(m))}</span>`});
      c.heyairi.forEach(d => put(d, {o: 901, h: `<span class="chip ghost" title="${esc(nm)}の${esc(mLabel(m))}の部屋入り">${esc(nm)} 部屋入り</span>`}));
    });
  }
  const mk = new Map(); R.markers.forEach(x => { if (!mk.has(x.dn)) mk.set(x.dn, []); mk.get(x.dn).push(x.text); });
  const lbDays = new Set();
  T.events.filter(e => e.cat === 'longbreak').forEach(e => { for (let d = toDn(e.start); d <= toDn(e.end); d++) lbDays.add(d); });
  const evs = T.events.filter(e => e.cat !== 'longbreak').map(e => ({e, s: toDn(e.start), t: toDn(e.end)}));
  const cands = ui.drag && ui.drag.moved && ui.drag.cands;
  const rs = ui.rsel ? [Math.min(ui.rsel.a, ui.rsel.b), Math.max(ui.rsel.a, ui.rsel.b)] : null;

  let h = `<div class="wh"><span></span>${wdOrder().map(i => `<span class="${i === 5 ? 'sat' : i === 6 ? 'sun' : ''}">${WD[i]}</span>`).join('')}</div>`;
  for (let w = a; w <= b; w += 7) {
    const we = w + 6;
    const wev = evs.filter(x => x.s <= we && x.t >= w).map(x => ({...x, cs: Math.max(x.s, w), ct: Math.min(x.t, we)})).sort((p, q) => p.cs - q.cs || q.ct - p.ct);
    const ends = [];
    wev.forEach(x => { let l = ends.findIndex(v => v < x.cs); if (l < 0) { l = ends.length; ends.push(x.ct); } else ends[l] = x.ct; x.l = l; });
    const nl = Math.min(ends.length, 4);
    let ml = '';
    for (let d = w; d <= we; d++) { const v = dnYmd(d); if (v.d === 1 || d === a) { ml = `<b>${v.m}月</b>${v.m === 1 || d === a ? `<i>${v.y}年</i>` : ''}`; break; } }
    const lbw = range(w, we).some(d => lbDays.has(d));
    const tl = ts >= w && ts <= we ? `<i class="tml">${T.term.number}期</i>` : nfs >= w && nfs <= we ? `<i class="tml">${T.term.number + 1}期</i>` : '';
    h += `<div class="wk" style="--nl:${nl}"><div class="wl">${ml}${tl}${lbw ? '<i class="lbt">長期休暇</i>' : ''}</div><div class="days">`;
    for (let d = w; d <= we; d++) {
      const v = dnYmd(d), wd = dow(d), hol = holidayName(d), cls = ['cell'];
      if (d < ts || d > nfe) cls.push('out'); else if (d > te) cls.push('nterm');
      if (lbDays.has(d)) cls.push('lb');
      if (wd === 6) cls.push('sun'); if (wd === 5) cls.push('sat');

function openPop(html, x, y, onMount) {
  const pop = $('#pop'); pop.innerHTML = ''; const box = document.createElement('div'); box.innerHTML = html; pop.appendChild(box); pop.hidden = false;
  const r = pop.getBoundingClientRect();
  let left = x + 10, top = y + 10;
  if (left + r.width > innerWidth - 8) left = Math.max(8, innerWidth - r.width - 8);
  if (top + r.height > innerHeight - 8) top = Math.max(8, y - r.height - 10);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
  onMount && onMount(box);
}
function closePop() { const pop = $('#pop'); pop.hidden = true; pop.innerHTML = ''; if (ui.rsel) { ui.rsel = null; markRange(); } }
let modalOnClose = null;
function openModal(html, onMount) {
  const md = $('#modal'); md.innerHTML = '<div class="mb"><div class="md" role="dialog" aria-modal="true"></div></div>'; md.hidden = false;
  const box = md.querySelector('.md'); box.innerHTML = html;
  md.querySelector('.mb').addEventListener('pointerdown', e => { if (e.target.classList.contains('mb')) closeModal(); });
  box.addEventListener('click', e => { if (e.target.closest('[data-x="close"]')) closeModal(); });
  onMount && onMount(box);
}
function closeModal() { const md = $('#modal'); md.hidden = true; md.innerHTML = ''; const f = modalOnClose; modalOnClose = null; f && f(); }
function askText(title, value = '', note = '') {
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3>${note ? `<p class="muted">${esc(note)}</p>` : ''}<input class="w100" id="askIn" value="${esc(value)}"><div class="err-t" id="askErr" hidden>入力してください</div><div class="btns"><button data-x="no">やめる</button><button class="primary" data-x="yes">決める</button></div>`, box => {
      const inp = box.querySelector('#askIn'); setTimeout(() => { inp.focus(); inp.select(); }, 0);
      modalOnClose = () => res(null);
      const ok = () => { const v = inp.value.trim(); if (!v) { box.querySelector('#askErr').hidden = false; inp.classList.add('bad'); inp.focus(); return; } modalOnClose = null; closeModal(); res(v); };
      inp.addEventListener('input', () => { box.querySelector('#askErr').hidden = true; inp.classList.remove('bad'); });
      box.addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; if (b.dataset.x === 'yes') ok(); else closeModal(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); });

}

    const up = () => { sp.removeEventListener('pointermove', move); sp.removeEventListener('pointerup', up); sp.removeEventListener('pointercancel', up); sp.classList.remove('drag'); document.body.classList.remove('resizing'); savePrefs(); };
    sp.addEventListener('pointermove', move); sp.addEventListener('pointerup', up); sp.addEventListener('pointercancel', up);
  });
  sp.addEventListener('dblclick', () => { delete prefs.calW; savePrefs(); applySplit(); toast('カレンダーの幅を元に戻しました'); });
  sp.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return; e.preventDefault();
    setW($('#calScroll').getBoundingClientRect().width + (e.key === 'ArrowLeft' ? -40 : 40)); savePrefs();
  });
}
const CAL_SIZES = ['極小', '小', '中', '大', '特大'];
const calSize = () => { const n = prefs.calSize; return Number.isInteger(n) && n >= 0 && n < CAL_SIZES.length ? n : 2; };
function zoomCal(d) {
  const n = Math.max(0, Math.min(CAL_SIZES.length - 1, calSize() + d)); if (n === calSize()) return;
  keepView(() => { prefs.calSize = n; savePrefs(); });
}
async function switchTerm(n) {
  if (!root.terms[n]) {
    const info = termInfo(n);
    const ok = await askConfirm(`${n}期（${fmtY(toDn(info.start))}〜${fmtY(toDn(info.end))}）を新しく作ります。`, '作る');
    if (!ok) return;
    root.terms[n] = newTermState(n);
  }
  if (ui.viewOnly) { ui.viewOnly = false; history.replaceState(null, '', location.pathname + location.search); }
  root.current = n; T = migrate(root.terms[n]); undoStack = []; ui.sel = null; ui.compare = ''; save(); render(); initialScroll();
}
async function saveShared() {
  const n = T.term.number;
  const ok = await askConfirm(root.terms[n] ? `手元の${n}期のデータを、共有された内容で置き換えます。` : `共有された内容を${n}期として手元に保存します。`, '保存する');
  if (!ok) return;
  root.terms[n] = T; root.current = n; ui.viewOnly = false; undoStack = [];
  history.replaceState(null, '', location.pathname + location.search); save(); render(); toast('手元に保存しました。編集できます');
}
function openOwn() {
  ui.viewOnly = false; history.replaceState(null, '', location.pathname + location.search);
  if (!root.terms[root.current]) root.terms[root.current] = newTermState(root.current);
  T = migrate(root.terms[root.current]); undoStack = []; ui.sel = null; ui.compare = ''; render(); initialScroll();
}
function openHelp() {
  openModal(`<h3>使い方</h3>
    <section><h4>代議員会を置く・動かす</h4><ul>
      <li>カレンダーの日曜をクリックすると、代議員会を置けます。第一稿・議案配布・部屋入り・報告・報告集会が自動で並びます。</li>

    <section><h4>案を比べる・相談する</h4><ul>
      <li>上の「案を増やす」で案を複製して、別の日程を試せます。「比べる案」を選ぶと、その案が点線で重なります。</li>
      <li>「共有・印刷」から LINE用テキスト、印刷（PDF）、ファイル書き出しができます。</li>
      <li>決まったら「この案で確定」。確定後に日を動かすと、1か月前までの周知期限を出します。</li></ul></section>

      <li>クリックすると、いまの状態と引き継ぎの豆知識を教えてくれます。注意とエラーが全部消えると喜びます。</li></ul></section>

      <li>右上の「Googleでログイン」でログインすると、データがクラウドにも保存され、どのブラウザ・パソコンからでも同じ日程を見られます。別のブラウザで変えた内容も自動で反映されます。読み書きできるのはログインした本人だけです。</li>
      <li>手元の index.html を直接開いたときはログインできません。公開ページから使ってください。</li></ul></section>
    <div class="btns"><button data-x="close">閉じる</button></div>`);
}

/* ===== イベント ===== */
function doAct(act, t, e) {
  switch (act) {
    case 'undo': undo(); break;
    case 'zoom': zoomCal(+t.dataset.d); break;
    case 'login': login(); break;
    case 'logout': logout(); break;
    case 'share': openShare(); break;
    case 'settings': openSettings(); break;
    case 'help': openHelp(); break;
    case 'confirm': confirmPlan(); break;
    case 'unconfirm': unconfirm(); break;
    case 'first-issue': jumpFirstIssue(t.dataset.lv); break;
    case 'plan': if (T.activePlanId !== t.dataset.pid) { T.activePlanId = t.dataset.pid; ui.sel = null; save(); render(); } break;
    case 'plan-menu': openPlanMenu(e.clientX, e.clientY); break;
    case 'save-shared': saveShared(); break;
    case 'open-own': openOwn(); break;
    case 'tab': ui.tab = t.dataset.tab; render(); $('#side').scrollTop = 0; break;
    case 'add-meeting': addMeetingNext(); break;
    case 'goto': { const d = +t.dataset.dn; if (t.dataset.mid) { ui.sel = t.dataset.mid; render(); } scrollToDn(d - 7); break; }
    case 'add-ag': openAgendaPop(t.dataset.mid, null, e.clientX, e.clientY); break;
    case 'del-meeting': delMeeting(t.closest('[data-mid]').dataset.mid); break;
    case 'reset-chain': { const id = t.closest('[data-mid]').dataset.mid; mutate(() => { findM(id).overrides = {}; }); break; }
    case 'toggle-h': toggleHeyairi(t.closest('[data-mid]').dataset.mid, +t.dataset.dn); break;
    case 'toggle-lock': {
      const id = t.closest('[data-mid]').dataset.mid, willLock = !findM(id).locked;
      if (willLock) { ui.stampId = id; setTimeout(() => { ui.stampId = null; }, 700); playPon(); }
      mutate(() => { const m = findM(id); m.locked = willLock; });
      toast(willLock ? `${mLabel(findM(id))}の日付を確定しました` : '日付の確定を外しました');
      break;
    }
    case 'add-event': {
      const d = Math.max(TODAY, toDn(T.term.start)), id = uid();
      mutate(() => T.events.push({id, title: 'テスト期間', cat: 'test', start: toStr(d), end: toStr(d + 6)}));
      const row = document.querySelector(`#side .evrow[data-eid="${id}"]`); if (row) { row.scrollIntoView({block: 'nearest'}); row.querySelector('input').select(); }
      break;
    }
    case 'del-event': { const id = t.closest('[data-eid]').dataset.eid; mutate(() => { T.events = T.events.filter(x => x.id !== id); }); break; }
  }
}
function onActClick(e) { const t = e.target.closest('[data-act]'); if (t && !t.disabled) doAct(t.dataset.act, t, e); }
function bindEvents() {
  ['#hdr', '#banner', '#planbar'].forEach(s => $(s).addEventListener('click', onActClick));
  $('#planbar').addEventListener('dblclick', e => { const t = e.target.closest('.ptab[data-pid]'); if (t && !ui.viewOnly) renamePlan(t.dataset.pid); });
  $('#planbar').addEventListener('change', e => {
    const k = e.target.dataset.actChange;
    if (k === 'compare') { ui.compare = e.target.value; render(); }
    else if (k === 'plan-memo') { const v = e.target.value; mutate(() => { activePlan().memo = v; }); }
  });
  $('#ov').addEventListener('click', e => {
    const t = e.target.closest('[data-mid]'); if (t) { selectMeeting(t.dataset.mid, true); return; }
    const r = e.currentTarget.getBoundingClientRect(), [a, b] = calRange();
    scrollToDn(a + Math.floor((e.clientX - r.left) / r.width * (b - a + 1)) - 7);
  });
  $('#cal').addEventListener('pointerdown', onCalDown);
  $('#kun').addEventListener('click', onKunClick);
  bindSplitter(); applySplit();
  const side = $('#side');
  side.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (t) { if (!t.disabled) doAct(t.dataset.act, t, e); return; }
    const ag = e.target.closest('.ag[data-aid]'); if (ag) { openAgendaPop(ag.dataset.mid, ag.dataset.aid, e.clientX, e.clientY); return; }
    if (e.target.closest('.mc-detail')) return;
    const card = e.target.closest('.mc[data-mid]');
    if (card) { const id = card.dataset.mid; if (ui.sel === id) { ui.sel = null; render(); } else selectMeeting(id, true); }
  });
  side.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.f) { updateMeetingField(t.closest('[data-mid]').dataset.mid, t.dataset.f, t.value); return; }
    if (t.dataset.ef) {
      const id = t.closest('[data-eid]').dataset.eid, k = t.dataset.ef, v = t.value;
      if ((k === 'start' || k === 'end') && !v) { render(); return; }
      mutate(() => { const ev = T.events.find(x => x.id === id); ev[k] = k === 'title' ? (v.trim() || ev.title) : v; if (ev.end < ev.start) { if (k === 'start') ev.end = ev.start; else ev.start = ev.end; } });
      return;
    }
    if (t.dataset.rule) { const k = t.dataset.rule, on = t.checked; mutate(() => { const s = new Set(T.settings.disabledRules); on ? s.delete(k) : s.add(k); T.settings.disabledRules = [...s]; }); }
  });
  side.addEventListener('dragstart', e => {
    const a = e.target.closest && e.target.closest('.ag[data-aid]');
    if (!a || ui.viewOnly) return;
    e.dataTransfer.setData('text/plain', a.dataset.aid); e.dataTransfer.effectAllowed = 'move';
    ui.agDrag = {aid: a.dataset.aid, from: a.dataset.mid};
  });
  side.addEventListener('dragover', e => {
    if (!ui.agDrag) return; const card = e.target.closest('.mc[data-mid]'); if (!card) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    side.querySelectorAll('.mc.dropin').forEach(c => { if (c !== card) c.classList.remove('dropin'); }); card.classList.add('dropin');
  });
  side.addEventListener('drop', e => {
    if (!ui.agDrag) return; const card = e.target.closest('.mc[data-mid]'); if (!card) return; e.preventDefault();
    const {aid, from} = ui.agDrag, to = card.dataset.mid; ui.agDrag = null;
    if (to === from) { render(); return; }
    mutate(() => { const fm = findM(from), tm = findM(to), i = fm.agenda.findIndex(a => a.id === aid); if (i < 0 || !tm) return; const [a] = fm.agenda.splice(i, 1); tm.agenda.push(a); });
    toast(`議案を${mLabel(findM(to))}へ移しました`);
  });
  side.addEventListener('dragend', () => { ui.agDrag = null; side.querySelectorAll('.mc.dropin').forEach(c => c.classList.remove('dropin')); });
  document.addEventListener('pointerdown', e => { const pop = $('#pop'); if (!pop.hidden && !pop.contains(e.target)) closePop(); }, true);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#modal').hidden) { closeModal(); return; }
      if (!$('#pop').hidden) { closePop(); return; }
      if (dragOff) { dragOff(); return; }
      if (ui.sel) { ui.sel = null; render(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
      const tag = document.activeElement && document.activeElement.tagName;
      if (/INPUT|TEXTAREA|SELECT/.test(tag) || !$('#modal').hidden) return;
      e.preventDefault(); undo();
    }
  });
  $('#fileIn').addEventListener('change', onImportFile);
  window.addEventListener('beforeprint', () => { if (!$('#print').innerHTML) $('#print').innerHTML = printHTML(activePlan()); });
  window.addEventListener('afterprint', () => { $('#print').innerHTML = ''; });
}
function initialScroll() {
  requestAnimationFrame(() => { const [a, b] = calRange(); scrollToDn(TODAY >= a && TODAY <= b ? TODAY - 7 : toDn(T.term.start) - 7, false); });
}
async function boot() {
  root = load(); loadPrefs();
  if (!root) root = {version: 1, current: guessTerm(), terms: {}};
  if (root.prefs) { prefs = {...root.prefs, ...prefs}; delete root.prefs; savePrefs(); } // 以前は root に入れていた
  if (!root.terms[root.current]) root.terms[root.current] = newTermState(root.current);
  T = migrate(root.terms[root.current]);
  save();
  if (location.hash.startsWith('#s=')) {
    try { const p = await decodeShare(location.hash.slice(3)); if (p && p.t && Array.isArray(p.t.plans) && p.t.term) { T = migrate(p.t); ui.viewOnly = true; } else throw new Error('bad'); }
    catch (e) { setTimeout(() => toast('共有リンクを読み込めませんでした'), 300); }
  }
  bindEvents(); render(); initialScroll();
  if (migratedNote) setTimeout(() => toast(migratedNote), 400);
  window.addEventListener('beforeunload', e => { if (cloud.status === 'saving') { e.preventDefault(); e.returnValue = ''; } });
  initCloud();
}
boot();
